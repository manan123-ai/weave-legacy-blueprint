    <!--
      Organization/WebSite/FAQ structured data is injected per-route by the
      <SEO> component (src/components/SEO.tsx) via react-helmet-async and
      captured into the static HTML by scripts/prerender.mjs. It is
      deliberately NOT duplicated here — a hardcoded copy plus the
      Helmet-injected copy would both survive prerendering (script tags
      aren't deduped the way meta tags are), producing conflicting
      Organization/WebSite/FAQPage blocks on the same page.
    -->

    <!-- Google Analytics 4 (G-QBWVZKKH4H) with consent mode: analytics storage is denied by default for visitors in European time zones until they accept -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QBWVZKKH4H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      var jncTz = ''; try { jncTz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
      var jncEu = /^Europe\//.test(jncTz) || jncTz === 'Atlantic/Reykjavik';
      var jncSaved = null; try { jncSaved = localStorage.getItem('jnc_consent'); } catch (e) {}
      gtag('consent', 'default', {
        ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied',
        analytics_storage: (jncEu && jncSaved !== 'granted') ? 'denied' : 'granted'
      });
      gtag('js', new Date());
      gtag('config', 'G-QBWVZKKH4H');
      // Count enquiry actions: WhatsApp, email and phone clicks
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a') : null;
        if (!a || !a.href) return;
        var href = a.href, method = '';
        if (href.indexOf('wa.me') > -1 || href.indexOf('whatsapp.com') > -1) method = 'whatsapp';
        else if (href.indexOf('mailto:') === 0) method = 'email';
        else if (href.indexOf('tel:') === 0) method = 'phone';
        if (method) gtag('event', 'generate_lead', { method: method, page_path: location.pathname });
      }, true);
      // Small consent notice, shown only to visitors in European time zones who have not chosen yet
      window.addEventListener('DOMContentLoaded', function () {
        if (!jncEu || jncSaved) return;
        var bar = document.createElement('div');
        bar.setAttribute('role', 'dialog'); bar.setAttribute('aria-label', 'Analytics cookies');
        bar.style.cssText = 'position:fixed;left:12px;bottom:12px;max-width:360px;z-index:60;background:#f6f1e7;color:#2b2b2b;border:1px solid #cfc6b2;border-radius:8px;padding:12px 14px;font:13px/1.45 system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.15)';
        bar.innerHTML = 'We use analytics cookies to see which pages help buyers. <span style="display:block;margin-top:8px"><button id="jncYes" style="background:#2b2b2b;color:#fff;border:0;border-radius:4px;padding:6px 12px;margin-right:6px;cursor:pointer">Accept</button><button id="jncNo" style="background:transparent;color:#2b2b2b;border:1px solid #2b2b2b;border-radius:4px;padding:6px 12px;cursor:pointer">Decline</button></span>';
        document.body.appendChild(bar);
        function done(v) { try { localStorage.setItem('jnc_consent', v); } catch (e) {} if (v === 'granted') gtag('consent', 'update', { analytics_storage: 'granted' }); bar.remove(); }
        document.getElementById('jncYes').onclick = function () { done('granted'); };
        document.getElementById('jncNo').onclick = function () { done('denied'); };
      });
    </script>

  <body>
    <!--
      Instant splash — paints before React loads so the user sees the
      brand identity immediately (no white flash). React's <Preloader />
      mounts on top with the same background, then fades out together.
    -->
    <style>
      #initial-splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #EFEAE2;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column;
        transition: opacity .5s ease;
      }
      #initial-splash img { width: 180px; height: 180px; object-fit: contain; }
      #initial-splash .bar { margin-top: 32px; width: 200px; height: 1px; overflow: hidden; }
      #initial-splash .bar > span {
        display: block; height: 100%; width: 100%;
        background: #c9a84c;
        transform: scaleX(0);
        transform-origin: left;
        animation: jco-load 1.5s ease-in-out forwards;
      }
      @keyframes jco-load {
        0% { transform: scaleX(0); }
        100% { transform: scaleX(1); }
      }
      .react-mounted #initial-splash { opacity: 0; pointer-events: none; }
    </style>
    <div id="initial-splash" aria-hidden="true">
      <img src="/jco-logo.png" alt="Janki Nath & Co. — JCO Fabrics" />
      <div class="bar"><span></span></div>
    </div>

    <div id="root"></div>

    <!--
      Hidden static form for Netlify form detection.
      Netlify scans the built HTML for forms at deploy time. Because our app
      is a React SPA, the live form is rendered by JS and is invisible to the
      crawler — so we mirror its fields here. Field `name` attributes MUST
      match the React form. Do not remove.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="fabricInterest" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
    <!--
      The instant splash is now hidden by a useEffect in the root App
      component (src/App.tsx), which fires the instant React actually
      mounts — no polling, no artificial delay. Previously this ran a
      setInterval polling document.getElementById('root').childNodes
      every 100ms for up to 40 tries (4s worst case) before even starting
      the 600ms fade — a real, measured contributor to a 7+ second LCP
      on desktop in a Lighthouse audit. A mount-effect fires as soon as
      React commits, with no polling granularity or artificial ceiling.
    -->
  </body>
